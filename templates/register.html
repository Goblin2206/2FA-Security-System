<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - 2FA</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="security-icon">
        🔐
    </div>

    <h2>Create Account</h2>

    <p>
        Register for Two-Factor Authentication
    </p>


    <!-- ERROR MESSAGE -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            {% if category == "register_error" %}

                <div class="error-message">
                    ❌ {{ message }}
                </div>

            {% endif %}

        {% endfor %}

    {% endwith %}


    <!-- REGISTER FORM -->

    <form method="POST">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required>

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>

        </div>


        <button type="submit">
            Register
        </button>

    </form>


    <a href="{{ url_for('login') }}">
        Already have an account? Login
    </a>

</div>

</body>

</html>
