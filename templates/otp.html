<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OTP Verification - 2FA</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="security-icon">
        🔐
    </div>

    <h2>OTP Verification</h2>

    <p>
        Enter the 6-digit OTP generated for your login
    </p>


    <!-- OTP ERROR -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            {% if category == "otp_error" %}

                <div class="error-message">
                    ❌ {{ message }}
                </div>

            {% endif %}

        {% endfor %}

    {% endwith %}


    <!-- OTP FORM -->

    <form method="POST">

        <div class="form-group">

            <label for="otp">
                One-Time Password
            </label>

            <input
                type="text"
                id="otp"
                name="otp"
                class="otp-input"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required>

        </div>


        <button type="submit">
            Verify OTP
        </button>

    </form>


    <a href="{{ url_for('login') }}">
        Back to Login
    </a>

</div>

</body>

</html>
